<!doctype html><html lang="th"><head>
<title>Parts Price - เทียบราคาอุปกรณ์ Arduino</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head><body>
<header class="top"><div class="wrap">
  <a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></span>Parts Price</a>
  <nav class="nav"><a href="/" aria-current="page">ค้นหา</a><a href="/shipping" >ค่าส่ง</a></nav>
</div></header>
<main class="wrap">
  <section class="hero compact">
    <h1>ค้นของ <em>เลือกเอง</em> แล้วให้เราหาร้านที่ถูกสุด</h1>
    <p>รวมสินค้าจาก 3 ร้านในไทย คุณเลือกเองว่าชิ้นไหนใช่ ระบบคำนวณจากของที่เลือกพร้อมค่าส่ง ไม่เดาแทนคุณ</p>
  </section>

  <form class="searchbar" id="sform" role="search" autocomplete="off">
    <label class="field big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ค้นหาสินค้า เช่น esp32 devkit, dht11, ตัวต้านทาน 10k" maxlength="120" aria-label="ค้นหาสินค้า"></label>
    <button class="btn" id="sgo" type="submit">ค้นหา</button>
  </form>
  <div class="try"><span class="hint">ลองดู:</span><span id="try"></span></div>

  <div class="layout">
    <section id="main">
      <div id="plan"></div>
      <div id="results"></div>
    </section>
    <aside class="panel basket" id="basket" aria-label="ตะกร้า"></aside>
  </div>
</main>
<div class="mbar" id="mbar" hidden><span id="mcount"></span><button class="btn" id="mgo" type="button">คำนวณราคา</button></div>
<footer class="wrap foot">ราคาและค่าส่งเปลี่ยนได้ ตรวจอีกครั้งตอนจ่ายเงิน. ข้อมูลและรูปมาจากหน้าค้นหาสาธารณะของแต่ละร้าน เป็นของร้านนั้นๆ.</footer>
<script src="/app.js"></script>
</body></html>
